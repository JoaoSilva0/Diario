<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C111F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Livro dos Dias">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Livro dos Dias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one notebook column with a sticky tab bar; cobalt ink on blue-tinted paper, ochre reserved for "highlight" moments */
:root{
  --paper:#F4F6FB; --sheet:#FFFFFF; --ink:#151B30; --muted:#5A6382; --line:#DCE1EE;
  --cobalt:#2747B8; --cobalt-ink:#FFFFFF; --cobalt-soft:#E5EAFB; --ochre:#B97F00; --ochre-soft:#FBF0D1;
  --good:#1D8657; --bad:#BE3D36; --shadow:0 1px 2px rgba(20,30,70,.06),0 8px 24px -12px rgba(20,30,70,.18);
  --h0:#E9ECF4; --h1:#CBD5F4; --h2:#A0B2EC; --h3:#6C88DF; --h4:#3D5DCB; --h5:#1E389C;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-ui:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C111F; --sheet:#131A2D; --ink:#E6EAF7; --muted:#99A2C1; --line:#253050;
  --cobalt:#8FA7FF; --cobalt-ink:#0C111F; --cobalt-soft:#1B2547; --ochre:#F2C14E; --ochre-soft:#382E12;
  --good:#4CC38A; --bad:#F07A72; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --h0:#1A2238; --h1:#233163; --h2:#2F4594; --h3:#4864C8; --h4:#728EF2; --h5:#B0C1FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C111F; --sheet:#131A2D; --ink:#E6EAF7; --muted:#99A2C1; --line:#253050;
  --cobalt:#8FA7FF; --cobalt-ink:#0C111F; --cobalt-soft:#1B2547; --ochre:#F2C14E; --ochre-soft:#382E12;
  --good:#4CC38A; --bad:#F07A72; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  --h0:#1A2238; --h1:#233163; --h2:#2F4594; --h3:#4864C8; --h4:#728EF2; --h5:#B0C1FF; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* header */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{color:var(--cobalt)}
.storage{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.storage i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.storage.ok i{background:var(--good)} .storage.warn i{background:var(--ochre)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 10px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:.92rem}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--cobalt)}

.banner{margin-top:14px;background:var(--ochre-soft);border:1px solid color-mix(in srgb,var(--ochre) 40%,transparent);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}

/* generic */
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
h2.sec{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em;margin:0;text-wrap:balance}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cobalt)}
.btn.primary{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input,select.input{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 10px;min-width:0}
.input:focus{border-color:var(--cobalt);outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:.84rem;font-weight:600;line-height:1.3;max-width:100%}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip button{border:0;background:none;padding:0 0 0 2px;color:var(--muted);font-size:1rem;line-height:1}
.chip button:hover{color:var(--bad)}
.chip.kw{background:var(--cobalt-soft);border-color:transparent;color:var(--cobalt)}
.chip.tag{background:var(--ochre-soft);border-color:transparent;color:var(--ochre)}
.chip.sugg{border-style:dashed;color:var(--muted);background:none}
.chip.sugg:hover{border-color:var(--cobalt);color:var(--ink)}
.chip.off{opacity:.45;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
a.link,button.link{color:var(--cobalt);background:none;border:0;padding:0;font-weight:600;text-decoration:none;cursor:pointer;text-align:left}
button.link:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}

/* today */
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
@media (max-width:860px){.today{grid-template-columns:1fr}}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .date{font-family:var(--f-display);font-weight:700;font-size:1.35rem;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:1rem;flex:none}
.iconbtn:hover{border-color:var(--cobalt)}
.score{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.score button{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:8px 0;font-family:var(--f-mono);font-weight:500;font-size:.9rem}
.score button:hover{border-color:var(--cobalt)}
.score button.on{background:var(--cobalt);color:var(--cobalt-ink);border-color:var(--cobalt)}
.score button.in{background:var(--cobalt-soft);border-color:transparent}
.paper{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.paper textarea{display:block;width:100%;min-height:340px;border:0;resize:vertical;padding:16px 18px 20px 52px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px);background-attachment:local;line-height:32px;font-family:var(--f-body);font-size:1.04rem;outline:none}
.paper::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--bad) 45%,transparent);pointer-events:none}
.paper textarea::placeholder{color:var(--muted);font-style:italic}
.meta-fields{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
@media (max-width:520px){.meta-fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.75rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.status{font-size:.8rem;color:var(--muted);min-height:1.2em}
.status.err{color:var(--bad)}
.factor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.dots{display:flex;gap:5px}
.dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);padding:0;font-size:.7rem;font-family:var(--f-mono);color:transparent}
.dots button:hover{border-color:var(--cobalt);color:var(--muted)}
.dots button.on{background:var(--cobalt);border-color:var(--cobalt)}
.addp{position:relative}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:5;overflow:hidden}
.ac button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px}
.ac button:hover,.ac button.sel{background:var(--cobalt-soft)}
.memory{border-left:3px solid var(--ochre);padding-left:12px;display:flex;flex-direction:column;gap:6px}
.memory p{font-family:var(--f-body);margin:0;font-size:.95rem;line-height:1.55}

/* archive */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:18px}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat-wrap svg{display:block}
.legend{display:flex;gap:4px;align-items:center;font-size:.75rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;align-items:start}
.entry:hover{background:var(--cobalt-soft)}
.entry .d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);line-height:1.3}
.entry .d b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink);line-height:1}
.entry .t{font-family:var(--f-body);font-size:.95rem;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.entry .who{font-size:.8rem;color:var(--muted);margin-top:4px}
.badge{font-family:var(--f-mono);font-size:.85rem;font-weight:500;min-width:34px;text-align:center;border-radius:6px;padding:3px 6px;background:var(--cobalt-soft);color:var(--cobalt)}
.badge.hi{background:var(--cobalt);color:var(--cobalt-ink)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
@media (max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}

/* retro */
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fact{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ochre);font-weight:700}
.fact .v{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.25;text-wrap:balance}
.fact .s{font-size:.84rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.88rem;background:none;border:0;padding:2px 0;text-align:left;width:100%}
.bar:hover .lbl{color:var(--cobalt)}
.bar .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bar .trk{height:10px;background:var(--h0);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--cobalt);border-radius:999px}
.bar .fill.o{background:var(--ochre)}
.bar .n{font-family:var(--f-mono);font-size:.82rem;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.effect{display:grid;grid-template-columns:minmax(0,1fr) 60px 64px;gap:8px;font-size:.88rem;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.effect .delta{font-family:var(--f-mono);text-align:right;font-weight:500}
.up{color:var(--good)} .down{color:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--sheet);padding:6px 10px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--cobalt);color:var(--cobalt-ink)}
.empty{padding:40px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{font-family:var(--f-display);font-size:1.3rem;margin:0}
.empty p{max-width:46ch;margin:0;color:var(--muted)}

/* people */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.pcard:hover{border-color:var(--cobalt)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;flex:none;font-size:1rem}
.pcard .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .sb{font-size:.8rem;color:var(--muted)}

/* sheet (modal) */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding-inline:12px;padding-block:calc(24px + env(safe-area-inset-top,0px)) 24px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;max-width:760px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h .ttl{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:1.2rem;text-wrap:balance}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.reading{font-family:var(--f-body);font-size:1.06rem;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.reading mark{background:var(--cobalt-soft);color:var(--cobalt);border-radius:3px;padding:0 2px}
.reading mark.p{background:var(--ochre-soft);color:var(--ochre)}
.highlight{font-family:var(--f-body);font-style:italic;font-size:1.1rem;border-left:3px solid var(--ochre);padding-left:12px;margin:0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kv div{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px}
.kv b{display:block;font-family:var(--f-display);font-size:1.25rem}
.kv span{font-size:.75rem;color:var(--muted)}
.minibars{display:flex;align-items:flex-end;gap:3px;height:70px}
.minibars i{flex:1;background:var(--cobalt);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}

/* settings */
.set-row{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
@media (max-width:600px){.set-row{grid-template-columns:1fr auto}.set-row .pat{grid-column:1/-1;grid-row:2}}
textarea.input{width:100%;min-height:120px;font-family:var(--f-mono);font-size:.8rem}
.stars{letter-spacing:1px;background:linear-gradient(90deg,var(--ochre) var(--v,0%),var(--line) var(--v,0%));-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.05rem;line-height:1;white-space:nowrap}
.film-ed{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px}
.film-ed select.input{padding:6px 8px}
.vbars{display:flex;gap:4px;align-items:flex-end}
.vcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:150px;min-width:0}
.vcol i{display:block;width:100%;background:var(--ochre);border-radius:4px 4px 0 0;min-height:2px}
.vcol .vn,.vcol .vl{font-family:var(--f-mono);font-size:.68rem;color:var(--muted);white-space:nowrap}
.film-row{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.entry .rt{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>Livro <span>dos</span> Dias</h1>
      <div class="storage" id="storage"><i></i><span>A abrir…</span></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-view="hoje">Escrever</button>
      <button class="tab" role="tab" data-view="arquivo">Arquivo</button>
      <button class="tab" role="tab" data-view="retro">Retrospetiva</button>
      <button class="tab" role="tab" data-view="pessoas">Pessoas</button>
      <button class="tab" role="tab" data-view="filmes">Filmes</button>
      <button class="tab" role="tab" data-view="ajustes">Ajustes</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="banner"></div>
  <div id="main"><div class="empty"><h3>A abrir o teu diário…</h3><p>Só um momento.</p></div></div>
</main>
<div id="overlay"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(()=>{
"use strict";
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

    ps.forEach(id=>{pc.set(id,(pc.get(id)||0)+1);if(d.overall!=null){if(!pRat.has(id))pRat.set(id,[]);pRat.get(id).push(d.overall)}});
    for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const k=[ps[i],ps[j]].sort().join('|');pair.set(k,(pair.get(k)||0)+1)}
    (d.tags||[]).forEach(t=>{tc.set(t,(tc.get(t)||0)+1);if(d.overall!=null){if(!tRat.has(t))tRat.set(t,[]);tRat.get(t).push(d.overall)}});
    for(const w of norm(d.text).match(/[a-z]{4,}/g)||[]){if(!STOP.has(w)&&!pn.has(w))words.set(w,(words.get(w)||0)+1)}
  }
  const effect=(m,minN)=>[...m].filter(([,a])=>a.length>=minN&&base!=null).map(([k,a])=>({k,n:a.length,avg:avg(a),delta:avg(a)-base})).sort((a,b)=>b.delta-a.delta);
  const sortDesc=m=>[...m].sort((a,b)=>b[1]-a[1]);
  return{days,span,rated,base,people:sortDesc(pc),tags:sortDesc(tc),pairs:sortDesc(pair),
    pEffect:effect(pRat,3),tEffect:effect(tRat,3),wk,wkCount,wordsTotal,words:sortDesc(words),
    longest:longestStreak(days.map(d=>d.date)),best:[...rated].sort((a,b)=>b.overall-a.overall||(a.date<b.date?1:-1))[0],
    worst:[...rated].sort((a,b)=>a.overall-b.overall)[0]};
}

function heatmap(year){
  const cell=13,gap=3,step=cell+gap,left=30,top=20;
  const start=new Date(year,0,1);const off=(start.getDay()+6)%7;// monday=0
  const end=new Date(year,11,31);const total=Math.round((end-start)/864e5)+1;
  const weeks=Math.ceil((total+off)/7);const W=left+weeks*step,H=top+7*step;
  const fillFor=d=>{
    if(!d)return 'var(--h0)';
    if(S.heatBy==='nota'){if(d.overall==null)return 'var(--sheet)';return `var(--h${Math.min(5,Math.max(1,Math.ceil(d.overall/2)))})`}
    const k=S.heatBy.slice(2);const hit=S.heatBy==='film'?filmsOf(d).length>0:S.heatBy.startsWith('p:')?(d.people||[]).includes(k):(d.tags||[]).includes(k);
    return hit?'var(--ochre)':'var(--h1)';
  };
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Mapa dos dias de ${year}" style="font-family:var(--f-mono);font-size:9px">`;
  ['seg','','qua','','sex','',''].forEach((l,i)=>{if(l)s+=`<text x="0" y="${top+i*step+10}" fill="var(--muted)">${l}</text>`});
  let lastM=-1;const today=todayISO();
  for(let i=0;i<total;i++){
    const dt=new Date(year,0,1+i);const k=iso(dt);const idx=i+off;const w=Math.floor(idx/7),r=idx%7;
    if(dt.getMonth()!==lastM&&dt.getDate()<=7){lastM=dt.getMonth();s+=`<text x="${left+w*step}" y="12" fill="var(--muted)">${MES3[lastM]}</text>`}
    const d=S.days.get(k);const f=fillFor(d);
    const stroke=d&&S.heatBy==='nota'&&d.overall==null?'stroke="var(--cobalt)" stroke-width="1.2"':k===today?'stroke="var(--ink)" stroke-width="1.2"':'';
    s+=`<rect x="${left+w*step}" y="${top+r*step}" width="${cell}" height="${cell}" rx="3" fill="${f}" ${stroke} ${d?`data-a="open-day" data-d="${k}" style="cursor:pointer"`:k<=today?`data-a="write-day" data-d="${k}" style="cursor:pointer"`:''}><title>${fmtShort(k)}${d?(d.overall!=null?' · nota '+d.overall:' · escrito'):''}</title></rect>`;
  }
  return s+'</svg>';
}

function fact(k,v,s){return `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`}

  const sf=[];st.days.forEach(d=>filmsOf(d).forEach(f=>sf.push({...f,date:d.date})));const sfr=sf.filter(f=>f.rating!=null).sort((a,b)=>b.rating-a.rating||(a.date<b.date?1:-1));

  if(st.words[0])out.push(fact('Palavra mais tua',`«${esc(st.words[0][0])}»`,`aparece ${plural(st.words[0][1],'vez','vezes')}`));

}

function lineChart(days,range){

  const val=d=>isO?d.overall:(d.ratings||{})[key];

  const bucketOf=ds=>{if(unit==='day')return ds;if(unit==='month')return ds.slice(0,7);const d=parse(ds);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return iso(d)};

  if(!pts.some(p=>p.v!=null))return '<p class="muted small" style="margin:0">Ainda sem notas neste período para este indicador.</p>';

  ticks.forEach(t=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(t)+3}" text-anchor="end" fill="var(--muted)">${t}</text>`});

  const real=pts.filter(p=>p.v!=null);
  if(real.length>1){const dpath=real.map((p,j)=>`${j?'L':'M'}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    s+=`<path d="${dpath} L${x(real[real.length-1].i).toFixed(1)},${T+ih} L${x(real[0].i).toFixed(1)},${T+ih} Z" fill="var(--cobalt)" opacity=".1"/>`;
    s+=`<path d="${dpath}" fill="none" stroke="var(--cobalt)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`}
  real.forEach((p,j)=>{const lastP=j===real.length-1;s+=`<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${lastP?4.5:keys.length>60?1.8:3}" fill="${lastP?'var(--ochre)':'var(--cobalt)'}"><title>${unit==='day'?fmtShort(p.k):unit==='week'?'Semana de '+fmtShort(p.k):MESES[+p.k.slice(5,7)-1]+' '+p.k.slice(0,4)}: ${f1(p.v)} (${plural(p.n,'dia','dias')})</title></circle>`});
  s+='</svg>';
  return s+`<p class="small muted" style="margin:0">${isO?'Nota do dia, 1–10':'Escala 1–5'} · média ${unit==='day'?'diária':unit==='week'?'semanal':'mensal'}. O ponto amarelo é o mais recente.</p>`;
}

function openSheet(title,body,actions=''){
  $('#overlay').innerHTML=`<div class="ov" data-a="close-ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-h"><div class="ttl">${title}</div>${actions}<button class="iconbtn" data-a="close" aria-label="Fechar">×</button></div><div class="sheet-b">${body}</div></div></div>`;
  document.body.style.overflow='hidden';
  const c=$('#overlay .sheet .iconbtn[data-a="close"]');c&&c.focus();
}
function closeSheet(){$('#overlay').innerHTML='';document.body.style.overflow='';if(S.view!=='hoje')render()}
function markText(text){
  const src=String(text||'');let nt='',map=[];
  for(let i=0;i<src.length;i++){const n=norm(src[i]);for(let k=0;k<n.length;k++){nt+=n[k];map.push(i)}}
  const ranges=[];
  const scan=(re,cls)=>{re.lastIndex=0;let m;while((m=re.exec(nt))){const st=m.index+m[1].length;const en=st+m[2].length;if(en>st)ranges.push([map[st],map[en-1]+1,cls]);if(m[0].length===0)re.lastIndex++}};
  KW.forEach(k=>k.res.forEach(r=>scan(r,'')));
  S.people.forEach(p=>personMatchers(p).forEach(r=>scan(r,'p')));
  const hr=/#[\p{L}\p{N}_-]{2,}/gu;let m;while((m=hr.exec(src)))ranges.push([m.index,m.index+m[0].length,'']);
  ranges.sort((a,b)=>a[0]-b[0]||b[1]-a[1]);
  let out='',pos=0;for(const [a,b,c] of ranges){if(a<pos)continue;out+=esc(src.slice(pos,a))+`<mark${c?' class="p"':''}>${esc(src.slice(a,b))}</mark>`;pos=b}
  return out+esc(src.slice(pos));
}

    ${(d.tags||[]).length?`<div><div class="eyebrow" style="margin-bottom:6px">Atividades</div><div class="chips">${d.tags.map(t=>`<button class="chip ${t.startsWith('#')?'tag':'kw'}" data-a="tag-filter" data-id="${esc(t)}">${esc(kwLabel(t))}</button>`).join('')}</div></div>`:''}
    ${filmsOf(d).length?`<div><div class="eyebrow">Filmes</div>${filmsOf(d).map(f=>`<div class="film-row"><div class="row"><b>${esc(f.title)}</b>${f.rating!=null?stars(f.rating)+`<span class="num small muted">${fmtR(f.rating)}/5</span>`:''}${f.where?`<span class="small muted">· ${esc(WHERE[f.where]||'')}</span>`:''}</div>${f.comment?`<div class="small muted">${esc(f.comment)}</div>`:''}</div>`).join('')}</div>`:''}
    <div class="reading">${markText(d.text)||'<span class="muted">Sem texto neste dia.</span>'}</div>
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:12px">

      ${next?`<button class="btn ghost" data-a="open-day" data-d="${next.date}">${esc(fmtShort(next.date))} ›</button>`:'<span></span>'}
    </div>`;
  openSheet(esc(fmtLong(date)),body,`<button class="btn" data-a="write-day" data-d="${date}">Editar</button>`);
}
function openPerson(id){
  const p=S.people.get(id);if(!p)return;
  const L=dayList().filter(d=>(d.people||[]).includes(id));
  const all=dayList();const base=avg(all.filter(d=>d.overall!=null).map(d=>d.overall));
  const withR=avg(L.filter(d=>d.overall!=null).map(d=>d.overall));
  const tc=new Map(),co=new Map();L.forEach(d=>{(d.tags||[]).forEach(t=>tc.set(t,(tc.get(t)||0)+1));(d.people||[]).forEach(o=>{if(o!==id&&S.people.has(o))co.set(o,(co.get(o)||0)+1)})});
  const tTop=[...tc].sort((a,b)=>b[1]-a[1]).slice(0,8);const cTop=[...co].sort((a,b)=>b[1]-a[1]).slice(0,6);
  // last 12 months bars
  const now=new Date();const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(iso(d).slice(0,7))}
  const mc=months.map(m=>L.filter(d=>d.date.startsWith(m)).length);const mmax=Math.max(1,...mc);
  const body=`
    <div class="row"><span class="avatar" style="background:${colorFor(id)};width:52px;height:52px;font-size:1.2rem">${esc(initials(p.name))}</span>
      <div style="flex:1;min-width:0"><div class="field"><label for="pName">NOME</label><input class="input" id="pName" value="${esc(p.name)}"></div></div></div>
    <div class="field"><label for="pAlias">OUTROS NOMES NO TEXTO (separados por vírgula)</label><input class="input" id="pAlias" placeholder="ex.: Mãe, Joana M." value="${esc((p.aliases||[]).join(', '))}"></div>
    <div class="field"><label for="pNote">NOTA</label><input class="input" id="pNote" placeholder="Quem é, de onde se conhecem…" value="${esc(p.note||'')}"></div>
    <div class="row"><button class="btn primary" data-a="person-save" data-id="${id}">Guardar</button><span class="small muted" id="pSaved"></span></div>
    ${L.length?`<div class="kv">
      <div><b>${L.length}</b><span>dias juntos</span></div>
      <div><b>${relDays(diffDays(L[L.length-1].date,todayISO()))}</b><span>última vez</span></div>
      <div><b>${esc(fmtShort(L[0].date))}</b><span>primeira vez no diário</span></div>
      <div><b>${f1(withR)}</b><span>nota média juntos${base!=null&&withR!=null?` · <span class="${withR-base>=0?'up':'down'}">${withR-base>=0?'+':'−'}${f1(Math.abs(withR-base))}</span>`:''}</span></div>
      <div><b>${longestStreak(L.map(d=>d.date))}</b><span>dias seguidos (máx.)</span></div>
    </div>
    <div><div class="eyebrow" style="margin-bottom:8px">Últimos 12 meses</div><div class="minibars">${mc.map((n,i)=>`<i style="height:${n/mmax*100}%;background:${colorFor(id)}" title="${MESES[+months[i].slice(5)-1]} ${months[i].slice(0,4)}: ${n}"></i>`).join('')}</div><div class="row small muted" style="justify-content:space-between"><span>${MES3[+months[0].slice(5)-1]}</span><span>${MES3[+months[11].slice(5)-1]}</span></div></div>
    ${tTop.length?`<div><div class="eyebrow" style="margin-bottom:6px">O que fazem juntos</div><div class="chips">${tTop.map(([t,n])=>`<span class="chip kw">${esc(kwLabel(t))} <span class="num">${n}</span></span>`).join('')}</div></div>`:''}
    ${cTop.length?`<div><div class="eyebrow" style="margin-bottom:6px">Costuma aparecer com</div><div class="chips">${cTop.map(([o,n])=>`<button class="chip" data-a="open-person" data-id="${o}"><span class="dot" style="background:${colorFor(o)}"></span>${esc(personName(o))} <span class="num muted">${n}</span></button>`).join('')}</div></div>`:''}
    <div><div class="eyebrow">Dias juntos</div><div class="entries">${[...L].reverse().slice(0,60).map(d=>`<button class="entry" data-a="open-day" data-d="${d.date}"><div class="d"><b>${parse(d.date).getDate()}</b>${MES3[parse(d.date).getMonth()]} ${d.date.slice(0,4)}</div><div class="t">${esc(d.highlight||d.text)}</div>${d.overall!=null?`<span class="badge">${d.overall}</span>`:'<span></span>'}</button>`).join('')}</div></div>`
    :'<p class="muted">Ainda não há dias com esta pessoa.</p>'}
    <div style="border-top:1px solid var(--line);padding-top:12px"><button class="btn danger" data-a="person-del" data-id="${id}">Apagar pessoa</button> <span class="small muted">Sai também dos dias onde aparece.</span></div>`;
  openSheet(esc(p.name),body);
}

function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function go(view){if(S.view==='hoje')flush();S.view=view;closeSheetSilently();render();window.scrollTo(0,0)}

function setDate(date){flush();S.date=date;loadDraft();closeSheetSilently();S.view='hoje';render();}
async function createPerson(name){
  name=String(name||'').trim().replace(/\s+/g,' ');if(!name)return null;
  const ex=[...S.people.values()].find(p=>norm(p.name)===norm(name));if(ex)return ex;
  const p={id:newId(),name,aliases:[],note:'',createdAt:todayISO()};
  try{await store.savePerson(p)}catch(e){toast(dbErr(e));return null}
  return p;
}

const armed=new WeakMap();

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='close-ov'&&e.target!==t)return;
  switch(a){
    case 'go':go(t.dataset.v);break;
    case 'close':case 'close-ov':closeSheet();break;
    case 'day-prev':setDate(addDays(S.date,-1));break;
    case 'day-next':setDate(addDays(S.date,1));break;
    case 'day-today':setDate(todayISO());break;
    case 'write-day':setDate(t.dataset.d);window.scrollTo(0,0);break;
    case 'open-day':flush();openDay(t.dataset.d);break;
    case 'open-person':flush();openPerson(t.dataset.id);break;
    case 'score':{const v=+t.dataset.v;S.draft.overall=S.draft.overall===v?null:v;touch();renderSide();break}
    case 'rate':{const f=t.dataset.f,v=+t.dataset.v;const r={...(S.draft.ratings||{})};if(r[f]===v)delete r[f];else r[f]=v;S.draft.ratings=r;touch();renderSide();break}
    case 'p-remove':S.draft.people=S.draft.people.filter(x=>x!==t.dataset.id);touch();renderSide();break;
    case 'p-add':addPersonToDraft(t.dataset.id);break;
    case 'p-create':{const p=await createPerson(t.dataset.name);if(p)addPersonToDraft(p.id);break}
    case 'p-pick':{let id=t.dataset.id;if(!id){const p=await createPerson(t.dataset.name);if(!p)break;id=p.id}addPersonToDraft(id);$('#padd').value='';$('#pac').hidden=true;$('#padd').focus();break}
    case 'tag-toggle':{const id=t.dataset.id;const ex=new Set(S.draft.excluded||[]);ex.has(id)?ex.delete(id):ex.add(id);S.draft.excluded=[...ex];touch();renderSide();break}
    case 'film-add':{S.draft.films=[...(S.draft.films||[]),{id:newId(),key:'',title:'',rating:null,raw:'',where:'',comment:'',auto:false,edited:true}];renderFilms();const ins=document.querySelectorAll('#films input[data-k="title"]');ins[ins.length-1]?.focus();break}
    case 'film-del':{const i=+t.dataset.i;const f=S.draft.films[i];if(!f)break;if(f.auto&&f.key)S.draft.filmExcluded=[...new Set([...(S.draft.filmExcluded||[]),f.key])];S.draft.films=S.draft.films.filter((_,j)=>j!==i);touch();renderFilms();break}
    case 'tag-unman':S.draft.manualTags=(S.draft.manualTags||[]).filter(x=>x!==t.dataset.id);touch();renderSide();break;
    case 'del-day':if(!confirmClick(t,'Apagar mesmo?'))break;try{await store.deleteDay(S.date)}catch(err){toast(dbErr(err));break}S.draft=blankDay(S.date);S.dirty=false;renderHoje();toast('Dia apagado');break;
    case 'random':{const L=dayList().filter(d=>d.date!==S.date);if(L.length)openDay(L[Math.floor(Math.random()*L.length)].date);break}
    case 'period':S.period=t.dataset.v;render();break;
    case 'chart':S.chartKey=t.dataset.v;render();break;
    case 'tag-filter':S.arch={q:'',person:'',tag:t.dataset.id,min:0};go('arquivo');break;
    case 'new-person':{const inp=$('#newPerson');const p=await createPerson(inp.value);if(p){inp.value='';render();toast(`${p.name} adicionad${/a$/i.test(p.name.split(' ')[0])?'a':'o'}`)}break}
    case 'person-save':{const p=S.people.get(t.dataset.id);if(!p)break;const name=$('#pName').value.trim();if(!name){toast('O nome não pode ficar vazio');break}
      const np={...p,name,aliases:$('#pAlias').value.split(',').map(s=>s.trim()).filter(Boolean),note:$('#pNote').value.trim()};
      try{await store.savePerson(np);$('#pSaved').textContent='Guardado';$('.sheet-h .ttl').textContent=name}catch(err){toast(dbErr(err))}break}
    case 'person-del':{if(!confirmClick(t,'Apagar mesmo?'))break;const id=t.dataset.id;
      try{for(const d of dayList().filter(d=>(d.people||[]).includes(id))){await store.saveDay({...clean(d),people:d.people.filter(x=>x!==id)})}await store.deletePerson(id)}catch(err){toast(dbErr(err));break}
      if(S.draft)S.draft.people=S.draft.people.filter(x=>x!==id);closeSheet();toast('Pessoa apagada');break}
    case 'factor-add':{const v=$('#newFactor').value.trim();if(!v)break;S.settings.factors.push({id:'f-'+newId(),label:v});await saveSettingsSafe();render();break}
    case 'factor-del':if(!confirmClick(t,'Apagar?'))break;S.settings.factors.splice(+t.dataset.i,1);await saveSettingsSafe();render();break;
    case 'kw-add':{const l=$('#newKwL').value.trim();const p=$('#newKwP').value.split(',').map(s=>s.trim()).filter(Boolean);if(!l)break;S.settings.keywords.push({id:'k-'+newId(),label:l,patterns:p.length?p:[l]});await saveSettingsSafe();render();break}
    case 'kw-del':if(!confirmClick(t,'Apagar?'))break;S.settings.keywords.splice(+t.dataset.i,1);await saveSettingsSafe();render();break;
    case 'retag':{const out=$('#retagOut');let n=0;t.disabled=true;
      try{for(const d of dayList()){const d2={...blankDay(d.date),...clean(d)};syncFilms(d2);d2.films=d2.films.filter(f=>f.title&&f.title.trim());const nt=computeTags(d2);if(JSON.stringify(nt)!==JSON.stringify(d.tags||[])||JSON.stringify(d2.films)!==JSON.stringify(d.films)){d2.tags=nt;await store.saveDay(d2);n++}}out.textContent=n?`${plural(n,'dia atualizado','dias atualizados')}.`:'Tudo já estava em dia.'}catch(err){out.textContent=dbErr(err)}
      t.disabled=false;break}
    case 'export':await doExport();break;
    case 'snooze':try{localStorage.setItem(SN_KEY,addDays(todayISO(),2))}catch(e){}renderBanner();break;
    case 'import':$('#importFile').click();break;
    case 'copy-export':{const ta=$('#exportText');try{await navigator.clipboard.writeText(ta.value);markExported();toast('Copiado')}catch(err){ta.focus();ta.select();toast('Seleciona e copia com Ctrl/Cmd+C')}break}
    case 'demo-on':enterDemo();break;
    case 'demo-off':exitDemo();break;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#overlay').firstChild){closeSheet();return}
  const t=e.target;
  if(t.id==='padd'){
    const items=[...document.querySelectorAll('#pac button')];let i=items.findIndex(b=>b.classList.contains('sel'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!items.length)return;items.forEach(b=>b.classList.remove('sel'));i=e.key==='ArrowDown'?(i+1)%items.length:(i-1+items.length)%items.length;items[i].classList.add('sel')}
    else if(e.key==='Enter'){e.preventDefault();(items[i]||items[0])?.click()}
    else if(e.key==='Escape'){$('#pac').hidden=true}
  }
  if(t.id==='newPerson'&&e.key==='Enter')document.querySelector('[data-a="new-person"]').click();
});
document.addEventListener('focusout',e=>{if(e.target.id==='padd')setTimeout(()=>{const ac=$('#pac');if(ac&&!ac.contains(document.activeElement))ac.hidden=true},150)});
function renderAc(q){
  const ac=$('#pac');q=q.trim();if(!q){ac.hidden=true;return}
  const nq=norm(q);
  const hits=[...S.people.values()].filter(p=>!S.draft.people.includes(p.id)&&(norm(p.name).includes(nq)||(p.aliases||[]).some(a=>norm(a).includes(nq)))).slice(0,6);
  const exact=[...S.people.values()].some(p=>norm(p.name)===nq);
  ac.innerHTML=hits.map((p,i)=>`<button data-a="p-pick" data-id="${p.id}" class="${i===0?'sel':''}">${esc(p.name)}</button>`).join('')+(exact?'':`<button data-a="p-pick" data-name="${esc(q)}" class="${hits.length?'':'sel'}">+ Criar «${esc(q)}»</button>`);
  ac.hidden=!ac.innerHTML;
}

/* ---------- export / import ---------- */
const LE_KEY='livro-dos-dias-ultima-copia',SN_KEY='livro-dos-dias-adiar';
function lastExport(){try{return localStorage.getItem(LE_KEY)}catch(e){return null}}
function markExported(){try{localStorage.setItem(LE_KEY,new Date().toISOString())}catch(e){}renderBanner()}
function backupDue(){let sn=null;try{sn=localStorage.getItem(SN_KEY)}catch(e){}if(sn&&sn>=todayISO())return false;const le=lastExport();return !le||diffDays(le.slice(0,10),todayISO())>=7}
async function doExport(){
  const data=JSON.stringify({app:'livro-dos-dias',version:1,exportedAt:new Date().toISOString(),days:dayList(),people:[...S.people.values()],settings:S.settings},null,2);
  const name=`livro-dos-dias-${todayISO()}.json`;
  const blob=new Blob([data],{type:'application/json'});
  try{const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Cópia do Livro dos Dias'});markExported();toast('Cópia exportada');return}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);markExported();toast('Cópia transferida');return}catch(e){}
  if(!$('#exportOut')){go('ajustes')}
  $('#exportOut').innerHTML=`<p class="small muted" style="margin:0">Copia este texto e guarda-o num ficheiro <span class="num">${esc(name)}</span>.</p><textarea class="input" id="exportText" readonly>${esc(data)}</textarea><div><button class="btn" data-a="copy-export">Copiar</button></div>`;
}
async function doImport(file){
  let j;try{j=JSON.parse(await file.text())}catch(e){toast('Este ficheiro não é uma cópia válida do diário.');return}
  if(!j||!Array.isArray(j.days)){toast('Este ficheiro não é uma cópia válida do diário.');return}
  const people=(j.people||[]).filter(p=>p&&p.id&&p.name);const days=j.days.filter(d=>d&&typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date));
  toast(`A importar ${days.length} dias…`);
  try{
    for(const p of people)await store.savePerson(p);
    if(j.settings){S.settings=mergeSettings(j.settings);await store.saveSettings()}
    for(const d of days)await store.saveDay({...blankDay(d.date),...d});
  }catch(e){toast(dbErr(e));return}
  $('#importFile').value='';loadDraft();render();toast(`Importados ${plural(days.length,'dia','dias')} e ${plural(people.length,'pessoa','pessoas')}`);
}

/* ---------- demo ---------- */
function enterDemo(){
  flush();
  S.real={mode:S.mode,days:S.days,people:S.people,settings:S.settings};
  S.mode='demo';S.settings=defaults();compileKeywords();
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const P=[['Ana Lopes'],['Rui'],['Marta'],['Tiago'],['Inês'],['Avó Lurdes']].map(([n],i)=>({id:'demo'+i,name:n,aliases:i===5?['avó']:[],note:'Pessoa de exemplo',createdAt:todayISO()}));
  S.people=new Map(P.map(p=>[p.id,p]));S.days=new Map();
  const FILMS=['Amélie','Parasite','Paddington 2','Interstellar','La La Land','Whiplash','Mamma Mia!','Inception','Lost in Translation','Before Sunrise','Coco','The Grand Budapest Hotel'];
  const NOTES=['3/5','3,5/5','4/5','4,5/5','7/10','8/10','5/5','2,5/5'];
  const acts=[[()=>`Fomos ao cinema ver o filme "${pick(FILMS)}", ${pick(['muito bom','esperava mais','saí de lá a sorrir'])}, dou ${pick(NOTES)}.`,['cinema']],[()=>`Vi em casa o filme "${pick(FILMS)}", ${pick(['um filme fofo de ver','adorei a banda sonora','um bocado lento'])}, dou ${pick(NOTES)}.`,['series']],['Jantar fora num restaurante novo em Alfama.',['jantar-fora']],['Tarde de praia, a água estava gelada.',['praia']],['Treino no ginásio de manhã.',['ginasio']],['Passeio pela serra ao fim da tarde.',['passeio','natureza']],['Ficámos em casa a ver uma série.',['series']],['Cozinhei um arroz de pato.',['cozinhar']],['Uns copos num bar no Cais do Sodré.',['copos']],['Dia longo de trabalho, muitas reuniões.',['trabalho']],['Li metade do livro novo.',['leitura']],['Aula do mestrado à noite.',['estudo']],['Jogo de padel ao fim do dia.',['padel']]];
  const moods=['Dia tranquilo.','Acordei cansado mas melhorou.','Que dia bom!','Dia meio cinzento.','Ri-me imenso.','Tudo correu como planeado.'];
  const highlights=['O pôr do sol no miradouro','Aquela conversa ao jantar','Ganhar finalmente o jogo','A sopa da avó','Ouvir a música certa no carro',''];
  const t=todayISO();
  for(let i=200;i>=1;i--){
    if(rnd()<0.28)continue;
    const date=addDays(t,-i);const wd=parse(date).getDay();const wkend=wd===0||wd===6;
    const nActs=1+Math.floor(rnd()*2);const chosen=[];for(let k=0;k<nActs;k++){const a=pick(wkend?acts.slice(0,8):acts);if(!chosen.includes(a))chosen.push(a)}
    const ppl=[];P.forEach((p,j)=>{const prob=[.42,.25,.2,.12,.1,.07][j]+(wkend?.1:0);if(rnd()<prob)ppl.push(p.id)});
    let text=pick(moods)+' '+chosen.map(c=>typeof c[0]==='function'?c[0]():c[0]).join(' ');
    if(ppl.length)text+=' Estive com '+ppl.map(id=>S.people.get(id).name.split(' ')[0]).join(' e ')+'.';
    if(rnd()<.15)text+=' #lisboa';
    let overall=Math.round(5+rnd()*3+(wkend?1:0)+(ppl.includes('demo0')?1:0)-(chosen.some(c=>c[1].includes('trabalho'))?1.5:0));overall=Math.max(1,Math.min(10,overall));
    const r={};S.settings.factors.forEach(f=>{if(rnd()<.85)r[f.id]=Math.max(1,Math.min(5,Math.round(overall/2+(rnd()-.5)*2)))});
    const d={...blankDay(date),text,overall:rnd()<.92?overall:null,ratings:r,people:ppl,highlight:rnd()<.35?pick(highlights):'',place:pick(['Lisboa','Lisboa','Lisboa','Cascais','Sintra','casa']),updatedAt:'demo'};
    syncFilms(d);d.tags=computeTags(d);d.words=(d.text.match(/\S+/g)||[]).length;S.days.set(date,d);
  }
  S.date=todayISO();loadDraft();S.view='retro';S.period='365';closeSheetSilently();render();window.scrollTo(0,0);
}
function exitDemo(){
  const r=S.real;S.real=null;S.mode=r.mode;S.days=r.days;S.people=r.people;S.settings=r.settings;compileKeywords();
  S.date=todayISO();loadDraft();S.view='hoje';closeSheetSilently();render();
}

if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
init();
})();
